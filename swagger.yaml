openapi: 3.0.0

info:
  title: Epson ChatBot API
  description: API untuk mengirim pertanyaan ke chatbot Epson
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Development Server

tags:
  - name: Auth
    description: Endpoint untuk menangani otentikasi pengguna
  - name: Chat
    description: Endpoint untuk interaksi dengan chatbot
  - name: Knowledge Base
    description: Endpoint untuk mengelola knowledge chatbot
  - name: Tiket
    description: Endpoint untuk mengelola tiket

paths:
  /api/auth/login/employee:
    post:
      operationId: loginKaryawan
      summary: Login karyawan
      description: Endpoint untuk login karyawan
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  description: Email pengguna
                  example: admin@gmail.com
                password:
                  type: string
                  description: Password pengguna
                  example: thesecretpassword
      responses:
        "204":
          description: Login berhasil
        "400":
          description: Request body tidak valid atau tidak dapat diproses
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Kode error singkat
                    example: invalid_json
                  message:
                    type: string
                    description: Penjelasan detail mengenai error
                    example: failed to parse JSON payload from the request body
        "401":
          description: Kredensial salah
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Jenis error
                    example: unauthenticated
                  message:
                    type: string
                    description: Penjelasan error
                    example: invalid credentials
        "422":
          description: Terdapat field yang tidak valid
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    field:
                      type: string
                      description: Nama field yang salah
                      example: password
                    error:
                      type: string
                      description: Kesalahan
                      example: min_length_8
                    message:
                      type: string
                      description: Penjelasan kesalahan
                      example: must be at least 8 characters long
  /chat:
    post:
      operationId: sendChatMessage
      summary: Ajukan Pertanyaan
      description: Endpoint untuk mengirim pertanyaan atau pesan ke sistem chatbot.
      tags:
        - Chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - pesan
              properties:
                pesan:
                  type: string
                  description: Pesan atau pertanyaan dari pengguna
                  example: Bagaimana mengatasi tinta printer tidak keluar?
      responses:
        "200":
          description: Pesan berhasil diproses oleh chatbot
          content:
            application/json:
              schema:
                type: object
                properties:
                  jawaban:
                    type: string
                    description: Jawaban dari chatbot
                    example: Coba lakukan head cleaning melalui menu maintenance pada printer Anda.

  /knowledge:
    get:
      operationId: listKnowledge
      summary: List Knowledge
      description: Mengambil seluruh data knowledge chatbot.
      tags:
        - Knowledge Base
      responses:
        "200":
          description: Berhasil mengambil daftar knowledge

    post:
      operationId: addKnowledge
      summary: Tambah Knowledge Base
      description: Menambahkan knowledge baru ke sistem.
      tags:
        - Knowledge Base
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pertanyaan:
                  type: string
                  example: Kenapa printer Epson berkedip?
                jawaban:
                  type: string
                  example: Biasanya karena ink pad counter penuh.
      responses:
        "200":
          description: Knowledge berhasil ditambahkan

  /knowledge/{id}:
    get:
      operationId: getKnowledge
      summary: Detail Knowledge Base
      description: Mengambil detail knowledge berdasarkan ID.
      tags:
        - Knowledge Base
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Berhasil mengambil detail knowledge

    put:
      operationId: editKnowledge
      summary: Edit Knowledge Base
      description: Mengubah data knowledge.
      tags:
        - Knowledge Base
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pertanyaan:
                  type: string
                jawaban:
                  type: string
      responses:
        "200":
          description: Knowledge berhasil diperbarui

    delete:
      operationId: deleteKnowledge
      summary: Hapus Knowledge
      description: Menghapus knowledge dari sistem.
      tags:
        - Knowledge Base
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Knowledge berhasil dihapus

  /tiket:
    post:
      operationId: createTiket
      summary: Membuat tiket eskalasi
      description: Membuat tiket eskalasi. Hanya dapat dilakukan oleh pengguna dengan role karyawan.
      tags:
        - Tiket
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - subjek
                - pesan
              properties:
                subjek:
                  type: string
                  description: Subjek permasalahan
                  example: Tinta printer tidak keluar
                pesan:
                  type: string
                  description: Penjelasan detail tentang kondisi permasalahan
                  example: Printer menyala normal, namun tinta tidak keluar saat mencetak dokumen.
      responses:
        "201":
          description: Tiket berhasil dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: ID tiket yang dibuat
                    example: 1
        "400":
          description: Request body tidak valid atau tidak dapat diproses
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Kode error singkat
                    example: invalid_json
                  message:
                    type: string
                    description: Penjelasan detail mengenai error
                    example: failed to parse JSON payload from the request body
        "401":
          description: Sesi tidak valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Jenis error
                    example: unauthenticated
                  message:
                    type: string
                    description: Penjelasan error
                    example: invalid session
        "403":
          description: Tidak memiliki akses
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Jenis error
                    example: forbidden
                  message:
                    type: string
                    description: Penjelasan error
                    example: the user's role does not have permission to perform this action.
        "422":
          description: Terdapat field yang tidak valid
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    field:
                      type: string
                      description: Nama field yang salah
                      example: password
                    error:
                      type: string
                      description: Kesalahan
                      example: min_length_8
                    message:
                      type: string
                      description: Penjelasan kesalahan
                      example: must be at least 8 characters long
        "500":
          description: Terjadi kesalahan pada server
